<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Black Friday Countdown</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #000000, #1a1a1a);
    font-family: 'Arial Black', sans-serif;
    color: #FFD700;
  }
  h1 {
    font-size: 2.5em;
    letter-spacing: 4px;
    margin-bottom: 30px;
    text-shadow: 0 0 15px #FFD700;
  }
  .countdown {
    display: flex;
    gap: 20px;
  }
  .flip-card {
    background: #111;
    border: 2px solid #FFD700;
    border-radius: 10px;
    padding: 20px 15px;
    min-width: 90px;
    text-align: center;
    box-shadow: 0 0 20px rgba(255, 215, 0, 0.4);
    position: relative;
    overflow: hidden;
  }
  .flip-card::before {
    content: "";
    position: absolute;
    top: 50%; left: 0; right: 0;
    height: 1px;
    background: #FFD700;
    opacity: 0.3;
  }
  .number {
    font-size: 3em;
    font-weight: bold;
    color: #FFD700;
    display: block;
    animation: flip 1s ease;
  }
  .label {
    font-size: 0.8em;
    color: #fff;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-top: 8px;
    display: block;
  }
  @keyframes flip {
    0% { transform: rotateX(0); }
    50% { transform: rotateX(90deg); }
    100% { transform: rotateX(0); }
  }
</style>
</head>
<body>
  <h1>🖤 BLACK FRIDAY 🖤</h1>
  <div class="countdown">
    <div class="flip-card"><span class="number" id="days">00</span><span class="label">Days</span></div>
    <div class="flip-card"><span class="number" id="hours">00</span><span class="label">Hours</span></div>
    <div class="flip-card"><span class="number" id="minutes">00</span><span class="label">Minutes</span></div>
    <div class="flip-card"><span class="number" id="seconds">00</span><span class="label">Seconds</span></div>
  </div>

<script>
  const target = new Date("2026-11-27T00:00:00").getTime();
  let prev = {};
  setInterval(() => {
    const now = Date.now();
    const dist = target - now;
    if (dist < 0) { document.querySelector('.countdown').innerHTML = "<h2>Deals are LIVE!</h2>"; return; }
    const vals = {
      days: Math.floor(dist / 86400000),
      hours: Math.floor((dist % 86400000) / 3600000),
      minutes: Math.floor((dist % 3600000) / 60000),
      seconds: Math.floor((dist % 60000) / 1000)
    };
    for (const key in vals) {
      const el = document.getElementById(key);
      const val = String(vals[key]).padStart(2, '0');
      if (prev[key] !== val) {
        el.textContent = val;
        el.style.animation = 'none';
        void el.offsetWidth;
        el.style.animation = 'flip 0.6s ease';
        prev[key] = val;
      }
    }
  }, 1000);
</script>
</body>
</html>
