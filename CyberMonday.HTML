<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cyber Monday Countdown</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: radial-gradient(circle, #0a0a2a, #000);
    font-family: 'Courier New', monospace;
    color: #00FFFF;
  }
  h1 {
    font-size: 2.5em;
    letter-spacing: 6px;
    margin-bottom: 30px;
    color: #FF00FF;
    text-shadow: 0 0 20px #FF00FF, 0 0 40px #00FFFF;
  }
  .countdown {
    display: flex;
    gap: 20px;
  }
  .flip-card {
    background: rgba(0, 255, 255, 0.05);
    border: 2px solid #00FFFF;
    border-radius: 8px;
    padding: 20px 15px;
    min-width: 90px;
    text-align: center;
    box-shadow: 0 0 25px #00FFFF, inset 0 0 15px rgba(255, 0, 255, 0.3);
  }
  .number {
    font-size: 3em;
    font-weight: bold;
    color: #00FFFF;
    text-shadow: 0 0 10px #00FFFF;
    display: block;
    animation: flip 1s ease;
  }
  .label {
    font-size: 0.8em;
    color: #FF00FF;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-top: 8px;
    display: block;
    text-shadow: 0 0 8px #FF00FF;
  }
  @keyframes flip {
    0% { transform: rotateX(0); }
    50% { transform: rotateX(90deg); opacity: 0.5; }
    100% { transform: rotateX(0); }
  }
</style>
</head>
<body>
  <h1>⚡ CYBER MONDAY ⚡</h1>
  <div class="countdown">
    <div class="flip-card"><span class="number" id="days">00</span><span class="label">Days</span></div>
    <div class="flip-card"><span class="number" id="hours">00</span><span class="label">Hours</span></div>
    <div class="flip-card"><span class="number" id="minutes">00</span><span class="label">Minutes</span></div>
    <div class="flip-card"><span class="number" id="seconds">00</span><span class="label">Seconds</span></div>
  </div>

<script>
  const target = new Date("2026-11-30T00:00:00").getTime();
  let prev = {};
  setInterval(() => {
    const now = Date.now();
    const dist = target - now;
    if (dist < 0) { document.querySelector('.countdown').innerHTML = "<h2>Cyber Deals LIVE!</h2>"; return; }
    const vals = {
      days: Math.floor(dist / 86400000),
      hours: Math.floor((dist % 86400000) / 3600000),
      minutes: Math.floor((dist % 3600000) / 60000),
      seconds: Math.floor((dist % 60000) / 1000)
    };
    for (const key in vals) {
      const el = document.getElementById(key);
      const val = String(vals[key]).padStart(2, '0');
      if (prev[key] !== val) {
        el.textContent = val;
        el.style.animation = 'none';
        void el.offsetWidth;
        el.style.animation = 'flip 0.6s ease';
        prev[key] = val;
      }
    }
  }, 1000);
</script>
</body>
</html>
